name: Build Android APK

# Builds the LRMS agent app on every push to main or a feature branch, on pull
# requests, and on manual dispatch. Produces the test report plus an APK you can
# actually install:
#
#   * Keystore secrets configured  -> a signed release APK (and the debug APK).
#   * No keystore secrets          -> the DEBUG APK only.
#
# The second case matters. `assembleRelease` without a signing config emits
# app-release-unsigned.apk, and Android refuses to install an unsigned APK, so
# shipping one as "the artefact" would hand you a file you cannot use. The debug
# APK is signed with the auto-generated debug key and installs straight away, so
# that is what an unsigned build uploads instead.
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Which variants to build (release needs keystore secrets)'
        required: false
        default: 'both'
        type: choice
        options: [both, debug, release]

# A newer push supersedes an in-flight run for the same ref.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Lifted to job level so the steps below can branch on whether a keystore
    # was supplied: the `secrets` context is not usable in a step-level `if`,
    # but `env` is.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          # Caches ~/.gradle based on the Gradle files in the repo.
          cache: gradle

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The wrapper JAR is committed, so verify it against Gradle's checksums.
          validate-wrappers: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Fails fast with a clear message rather than a compile error 20 minutes in.
      - name: Show environment
        run: |
          echo "Java:   $(java -version 2>&1 | head -1)"
          echo "Gradle: $(./gradlew --version | grep '^Gradle' | head -1)"
          echo "SDK:    ${ANDROID_HOME:-unset}"

      # Decides up front which variants are worth building, so every later step
      # is a simple flag check and the reason is visible in the log.
      - name: Plan the build
        id: plan
        run: |
          set -eu
          WANT="${{ github.event.inputs.build_type }}"
          [ -n "$WANT" ] || WANT=both

          if [ -n "${KEYSTORE_BASE64:-}" ]; then SIGN=yes; else SIGN=no; fi

          DEBUG=no
          RELEASE=no
          case "$WANT" in
            debug)
              DEBUG=yes
              ;;
            release)
              if [ "$SIGN" = yes ]; then
                RELEASE=yes
              else
                # An unsigned release APK cannot be installed, so asking for one
                # without a keystore gets a debug APK and a clear warning.
                DEBUG=yes
                echo "::warning::No keystore secrets are configured, so a signed release APK cannot be produced. Building the installable debug APK instead."
              fi
              ;;
            *)
              DEBUG=yes
              [ "$SIGN" = yes ] && RELEASE=yes
              ;;
          esac

          {
            echo "sign=$SIGN"
            echo "debug=$DEBUG"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "requested=$WANT  signing=$SIGN  ->  debug=$DEBUG  release=$RELEASE"

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        # Uploaded even on failure: the report is how you diagnose a red build.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

      - name: Build debug APK
        if: ${{ steps.plan.outputs.debug == 'yes' }}
        run: ./gradlew --no-daemon assembleDebug

      # app/build.gradle.kts wires up a release signingConfig only when
      # android/keystore.properties exists, so materialising that file from the
      # secrets is all that is needed.
      - name: Configure release signing
        if: ${{ steps.plan.outputs.release == 'yes' }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "::error::KEYSTORE_BASE64 is set but KEYSTORE_PASSWORD, KEY_ALIAS or KEY_PASSWORD is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore

          # A truncated or mis-pasted secret is an obscure Gradle failure later,
          # so check the keystore opens before spending 20 minutes on a build.
          if ! keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" > /dev/null 2>&1; then
            echo "::error::The decoded keystore could not be opened. Check KEYSTORE_BASE64 and KEYSTORE_PASSWORD."
            exit 1
          fi
          if ! keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Alias '$KEY_ALIAS' is not in the keystore. Aliases present:"
            keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i 'PrivateKeyEntry' || true
            exit 1
          fi

          # A wrong KEY_PASSWORD surfaces much later as Gradle's baffling
          # "Given final block not properly padded", so probe it now. How to
          # probe depends on the keystore format, which is why this is not a
          # one-liner:
          #
          #   PKCS12 (keytool's default since Java 9) encrypts the key with the
          #   STORE password and ignores any key password entirely - keytool even
          #   ignores -keypass at creation time with a warning. So a differing
          #   KEY_PASSWORD can never work, and no keytool probe detects it
          #   because every probe silently falls back to the store password.
          #   Comparing the two values is the only reliable check.
          #
          #   JKS encrypts each key separately, so -certreq is a real probe.
          STORE_TYPE=$(keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null \
            | sed -n 's/^Keystore type: //p' | head -1)
          echo "Keystore format: ${STORE_TYPE:-unknown}"

          if [ "$STORE_TYPE" = "PKCS12" ]; then
            if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
              echo "::error::KEY_PASSWORD differs from KEYSTORE_PASSWORD, but this is a PKCS12 keystore, which encrypts the private key with the store password and cannot hold a separate key password. keytool silently ignored the -keypass you gave when the keystore was created. Set KEY_PASSWORD to the same value as KEYSTORE_PASSWORD."
              exit 1
            fi
          else
            if ! keytool -certreq -alias "$KEY_ALIAS" -keystore release.keystore \
                   -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" > /dev/null 2>&1; then
              echo "::error::KEY_PASSWORD does not open the private key for alias '$KEY_ALIAS'."
              exit 1
            fi
          fi

          umask 077
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "Release signing configured for alias '$KEY_ALIAS'."

      - name: Build release APK
        if: ${{ steps.plan.outputs.release == 'yes' }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the release signature
        if: ${{ steps.plan.outputs.release == 'yes' }}
        run: |
          set -eu
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            echo "::error::Gradle produced an unsigned APK despite keystore.properties being present."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      # The keystore must never survive into an artefact, a cache or a log.
      - name: Remove the keystore
        if: always()
        run: rm -f release.keystore keystore.properties

      - name: Read the app version
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "name=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}"

      - name: Upload debug APK
        if: ${{ steps.plan.outputs.debug == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: lrms-debug-v${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload signed release APK
        if: ${{ steps.plan.outputs.release == 'yes' }}
        uses: actions/upload-artifact@v4
        with:
          name: lrms-release-v${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
          if-no-files-found: error

      - name: Upload R8 mapping file
        if: ${{ steps.plan.outputs.release == 'yes' }}
        # Required to symbolise a stack trace from a minified release build.
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping-${{ github.run_number }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Build summary
        if: always()
        run: |
          {
            echo "### LRMS Android build"
            echo ""
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | ${{ steps.version.outputs.name }} |"
            echo "| Run | #${{ github.run_number }} |"
            echo "| Commit | \`${GITHUB_SHA:0:8}\` |"
            echo "| Release signing | ${{ steps.plan.outputs.sign == 'yes' && 'configured' || 'not configured' }} |"
            echo ""
            # --apparent-size, not plain du: a signed and zipaligned APK is
            # block-padded on disk, so `du -h` reports roughly 6.7M for a 2.7M
            # file and makes the app look bloated in the summary.
            if ls app/build/outputs/apk/debug/*.apk > /dev/null 2>&1; then
              echo "**Debug APK** — debug-signed, installs on any device"
              for f in app/build/outputs/apk/debug/*.apk; do
                echo "- \`$(basename "$f")\` ($(du -h --apparent-size "$f" | cut -f1))"
              done
              echo ""
            fi
            if ls app/build/outputs/apk/release/app-release.apk > /dev/null 2>&1; then
              echo "**Release APK** — signed with your keystore, minified by R8"
              f=app/build/outputs/apk/release/app-release.apk
              echo "- \`$(basename "$f")\` ($(du -h --apparent-size "$f" | cut -f1))"
              echo ""
            fi
            if [ "${{ steps.plan.outputs.sign }}" != "yes" ]; then
              echo "> No keystore secrets are configured, so no release APK was built."
              echo "> Install the **debug APK** above. To get a signed release build, add the"
              echo "> \`KEYSTORE_BASE64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\` and \`KEY_PASSWORD\`"
              echo "> secrets — see DEPLOYMENT.md section 6.4."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Advisory only: a lint warning should not block an APK artefact.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew --no-daemon lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.*
          retention-days: 14
          if-no-files-found: ignore
